services:
  - type: web
    name: sports-celebrity-classifier
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: API_KEY
        generateValue: true
